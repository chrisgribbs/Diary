name: Listen check
on: { push: { branches: [audio-index] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Every chapter's recording is there
        run: |
          node -e "const a=require('./src/audio/web-henson.json');for(const f of a.files.flat())console.log(a.base+f)" > urls.txt
          wc -l urls.txt
          bad=0
          while read -r u; do
            r=$(curl -sS -o /dev/null -I -w "%{http_code} %{content_type}" "$u" || echo "000 x")
            case "$r" in "200 audio/mpeg"*) ;; *) echo "BAD $r $u"; bad=$((bad+1));; esac
          done < urls.txt
          echo "bad: $bad"; [ "$bad" = 0 ]
      - name: Play a chapter in WellWrite
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libasound2t64 >/dev/null 2>&1 || sudo apt-get install -y -qq xvfb >/dev/null 2>&1
          WELLWRITE_LISTEN_ONLINE=1 xvfb-run -a npx electron --no-sandbox test/listen.e2e.js 2>&1 | grep -vE "ALSA|dbus|alsa" | tail -15
          WELLWRITE_LISTEN_ONLINE=1 xvfb-run -a npx electron --no-sandbox test/listen.e2e.js 2>&1 | grep -q "listen e2e passed"
