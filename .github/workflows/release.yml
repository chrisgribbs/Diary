name: Release

# When the version in package.json changes on main, build the Windows installer
# and publish it as a GitHub release (tag v<version>). Installed copies of
# Daybook pick it up automatically. Versions already released are skipped.
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this version is already released
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "v$v is already released, nothing to do."
          fi

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.ver.outputs.skip != 'true'
        run: npm ci
      - if: steps.ver.outputs.skip != 'true'
        run: npm test
      - name: Build and publish v${{ steps.ver.outputs.version }}
        if: steps.ver.outputs.skip != 'true'
        shell: bash
        run: |
          set -o pipefail
          if ! npx electron-builder --win nsis --x64 --publish always 2>&1 | tee build.log; then
            # Surface the end of the log as an annotation so it's readable without the full log.
            tail -n 60 build.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > tail.txt
            echo "::error title=electron-builder failed::$(cat tail.txt)"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
