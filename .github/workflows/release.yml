name: Release

# When the version in package.json changes on main, build the Windows installer
# and publish it as a GitHub release (tag v<version>). Installed copies of
# WellWrite pick it up automatically. Complete releases are skipped; incomplete
# ones (e.g. an interrupted upload) are repaired.
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    # WellWrite's shared Bible relay (relay/worker.mjs) on Cloudflare, holding the API.Bible key as a secret.
    # Its address goes into both builds, so everyone gets the shared Bible versions without a key of their own.
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the Cloudflare secrets
        id: have
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APIBIBLE_KEY: ${{ secrets.APIBIBLE_KEY }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] && [ -n "$APIBIBLE_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning title=Shared Bible versions off::Set the CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and APIBIBLE_KEY secrets to share Bible versions with everyone."; fi
      - name: Put the relay online
        id: deploy
        if: steps.have.outputs.ok == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          command: deploy
          secrets: |
            APIBIBLE_KEY
        env:
          APIBIBLE_KEY: ${{ secrets.APIBIBLE_KEY }}
      - name: Its address
        id: url
        if: steps.have.outputs.ok == 'true'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          url="${DEPLOY_URL%/}"
          if [ -z "$url" ] || ! curl -fsS "$url/health" | grep -q '"key":true'; then
            echo "::warning title=Bible relay not reachable::The relay didn't come online (${url:-no address}). If this is a new Cloudflare account, open Workers & Pages in the dashboard once to choose a workers.dev name, then run this again."
            url=""
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Bible relay: ${url:-off}"

  windows:
    needs: relay
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check release status
        id: ver
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          assets=$(gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || echo "__none__")
          if [ "$assets" = "__none__" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if grep -qx "latest.yml" <<<"$assets" && grep -qx "WellWrite-Setup-$v.exe" <<<"$assets"; then
              echo "skip=true" >> "$GITHUB_OUTPUT"; echo "v$v is already fully released."
            fi
          fi

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.ver.outputs.skip != 'true'
        run: npm ci
      - name: Test
        if: steps.ver.outputs.skip != 'true'
        shell: bash
        run: |
          set -o pipefail
          if ! npm test 2>&1 | tee test.log; then
            msg=$(tail -n 40 test.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Tests failed::$msg"; exit 1
          fi

      - name: Add the shared Bible relay
        if: steps.ver.outputs.skip != 'true' && needs.relay.outputs.url != ''
        shell: bash
        run: echo '{"bible":"${{ needs.relay.outputs.url }}"}' > src/relay-config.json

      - name: Add Google sign-in settings
        if: steps.ver.outputs.skip != 'true'
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            node scripts/google-config.js
            echo "Google Drive backups are switched on for this build."
          else
            echo "::warning title=Google Drive off::The GOOGLE_CLIENT_ID secret isn't set, so this build can't connect to Google Drive."
          fi

      - name: Build installer
        if: steps.ver.outputs.skip != 'true'
        shell: bash
        run: |
          set -o pipefail
          if ! npx electron-builder --win nsis --x64 --publish never 2>&1 | tee build.log; then
            msg=$(tail -n 60 build.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Build failed::$msg"; exit 1
          fi
          ls -la dist

      - name: Publish v${{ steps.ver.outputs.version }}
        if: steps.ver.outputs.skip != 'true'
        shell: bash
        run: |
          set -o pipefail
          v=${{ steps.ver.outputs.version }}
          files=("dist/WellWrite-Setup-$v.exe" "dist/WellWrite-Setup-$v.exe.blockmap" "dist/latest.yml")
          {
            if [ "${{ steps.ver.outputs.exists }}" = "true" ]; then
              gh release upload "v$v" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            else
              gh release create "v$v" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "WellWrite $v" --notes "WellWrite $v. Installed copies update automatically."
            fi
          } 2>&1 | tee publish.log || {
            msg=$(tail -n 30 publish.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Publish failed::$msg"; exit 1
          }

  android:
    # After the Windows build, so the release already exists; adds WellWrite-<version>.apk to it.
    needs: [relay, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release status
        id: ver
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "WellWrite-$v.apk"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "The Android app for v$v is already released."
          fi
          if [ -z "${{ secrets.ANDROID_SIGNING }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Android app not built::The ANDROID_SIGNING secret isn't set, so the Android app can't be signed."
          fi
      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip != 'true'
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        if: steps.ver.outputs.skip != 'true'
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        if: steps.ver.outputs.skip != 'true'
        with: { gradle-version: '8.14.3' }
      - name: Build the Android app
        if: steps.ver.outputs.skip != 'true'
        env:
          # The signing key: its password on the first line, then the key file in base64.
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -o pipefail
          export WELLWRITE_KEYSTORE="$RUNNER_TEMP/wellwrite.keystore"
          export WELLWRITE_KEYSTORE_PASSWORD="$(printf '%s\n' "$ANDROID_SIGNING" | head -n 1 | tr -d '\r ')"
          printf '%s\n' "$ANDROID_SIGNING" | tail -n +2 | tr -d '\r ' | base64 -d > "$WELLWRITE_KEYSTORE"
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            node scripts/google-config.js
          fi
          if [ -n "${{ needs.relay.outputs.url }}" ]; then echo '{"bible":"${{ needs.relay.outputs.url }}"}' > src/relay-config.json; fi
          node android/scripts/prepare.js
          if ! gradle -p android assembleRelease 2>&1 | tee build.log; then
            msg=$(tail -n 60 build.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Android build failed::$msg"; exit 1
          fi
          rm -f "$WELLWRITE_KEYSTORE"
          cp android/app/build/outputs/apk/release/app-release.apk "WellWrite-${{ steps.ver.outputs.version }}.apk"
          ls -la *.apk
      - name: Add to release v${{ steps.ver.outputs.version }}
        if: steps.ver.outputs.skip != 'true'
        run: gh release upload "v${{ steps.ver.outputs.version }}" "WellWrite-${{ steps.ver.outputs.version }}.apk" --clobber --repo "$GITHUB_REPOSITORY"
