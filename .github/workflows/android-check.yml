name: Android check

# Builds the Android app and runs it on an emulator: opens WellWrite, creates a journal, writes an entry,
# and keeps screenshots and the log. Run by hand, or on pushes to the android branch.
on:
  workflow_dispatch:
  push:
    branches: [android]

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build
        run: |
          node android/scripts/prepare.js
          gradle -p android assembleDebug -Pabis=x86_64 --stacktrace
          ls -la android/app/build/outputs/apk/debug/
      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check
          path: smoke/
