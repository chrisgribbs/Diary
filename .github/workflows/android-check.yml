name: Android check

# Builds the Android app and runs it on an emulator: opens WellWrite, creates a journal, writes an entry,
# and keeps screenshots and the log. Run by hand, or on pushes to the android branch.
on:
  workflow_dispatch:
  push:
    branches: [android]

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build
        run: |
          node android/scripts/prepare.js
          gradle -p android assembleDebug -Pabis=x86_64 --stacktrace
          ls -la android/app/build/outputs/apk/debug/
      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/scripts/smoke.sh
      - name: Results
        if: always()
        run: |
          cat smoke/drive.log || true
          echo "----- log -----"; cat smoke/logcat-short.txt || true
      # Screenshots go to the android-check-results branch, so they can be looked at without downloading artifacts.
      - name: Keep screenshots
        if: always()
        run: |
          cd smoke
          git init -q -b android-check-results
          git -c user.name=wellwrite-ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=wellwrite-ci -c user.email=ci@users.noreply.github.com commit -qm "Android check ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" android-check-results
